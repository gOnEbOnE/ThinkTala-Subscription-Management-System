# Deploy Ubuntu server-yovan: docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
services:
  gateway:
    env_file:
      - ./deploy/server-yovan/gateway.env
    volumes:
      - ./deploy/server-yovan/routes.json:/app/routes.json:ro
      - ./gateway/certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      management:
        condition: service_started
      notification:
        condition: service_started
      operational:
        condition: service_started
      subscription:
        condition: service_started
      tickets:
        condition: service_started
      users:
        condition: service_started
      account:
        condition: service_started

  account:
    env_file:
      - ./deploy/server-yovan/account.env
    environment:
      - PORT=2001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    env_file:
      - ./deploy/server-yovan/notification.env
    environment:
      - PORT=5003
    depends_on:
      postgres:
        condition: service_healthy

  operational:
    env_file:
      - ./deploy/server-yovan/operational.env
    environment:
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  subscription:
    env_file:
      - ./deploy/server-yovan/subscription.env
    environment:
      - PORT=5004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  operational:
    env_file:
      - ./deploy/server-yovan/operational.env
    environment:
      - PORT=8080
    ports:
      - "5005:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  subscription:
    env_file:
      - ./deploy/server-yovan/subscription.env
    environment:
      - PORT=5004
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tickets:
    env_file:
      - ./deploy/server-yovan/tickets.env
    environment:
      - PORT=2004

  users:
    env_file:
      - ./deploy/server-yovan/users.env
    environment:
      - PORT=2006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  management:
    env_file:
      - ./deploy/server-yovan/management.env
    environment:
      - PORT=5006
      - MANAGEMENT_PORT=5006
    depends_on:
      postgres:
        condition: service_healthy
