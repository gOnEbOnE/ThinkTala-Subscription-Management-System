<!DOCTYPE html>
<html lang="id" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Langganan | ThinkTala</title>
    <meta name="description" content="Status langganan dan perpanjangan paket ThinkTala">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        .sub-page {
            width: calc(100% - var(--sidebar-width));
            max-width: none;
            margin: 0;
            box-sizing: border-box;
        }

        .subscription-list {
            display: grid;
            gap: 10px;
        }

        .subscription-item {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
        }

        .subscription-item-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-heading);
        }

        .subscription-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .renew-highlight {
            background: rgba(0, 242, 255, 0.06);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        @media (max-width: 767.98px) {
            .sub-page {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <div id="client-sidebar-placeholder"></div>
    <div id="client-navbar-placeholder"></div>

    <div class="main-content sub-page">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
            <div>
                <h4 class="fw-bold mb-0" style="color: var(--text-heading);">Status Langganan</h4>
                <small class="text-muted">Kelola langganan aktif dan ajukan perpanjangan</small>
            </div>
            <a href="/client/billing-history" class="btn btn-sm btn-outline-secondary">
                <i class="fa-solid fa-receipt me-1"></i>Riwayat Pesanan
            </a>
        </div>

        <div class="ai-card shadow-lg mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold text-muted text-uppercase small mb-0"><i class="fa-solid fa-crown me-2"></i>Langganan Saya</h6>
                <span id="subStatusBadge" class="badge" style="background:rgba(255,255,255,0.1);color:var(--text-muted);">Memuat...</span>
            </div>
            <div class="row g-3">
                <div class="col-md-4">
                    <small class="text-muted text-uppercase" style="font-size:0.68rem;">Paket</small>
                    <div class="fw-bold" id="subPackageName" style="color:var(--text-heading);">-</div>
                </div>
                <div class="col-md-4">
                    <small class="text-muted text-uppercase" style="font-size:0.68rem;">Aktif Sejak</small>
                    <div class="fw-semibold" id="subStartDate" style="color:var(--text-main);">-</div>
                </div>
                <div class="col-md-4">
                    <small class="text-muted text-uppercase" style="font-size:0.68rem;">Berakhir</small>
                    <div class="fw-semibold" id="subEndDate" style="color:var(--text-main);">-</div>
                </div>
            </div>
            <div class="mt-3 pt-3" style="border-top:1px solid var(--border-color);">
                <small class="text-muted text-uppercase" style="font-size:0.68rem;">Daftar Paket</small>
                <div id="subPackagesList" class="subscription-list mt-2">
                    <div class="text-muted small"><i class="fa-solid fa-spinner fa-spin me-1"></i>Memuat...</div>
                </div>
            </div>
            <div class="mt-3 pt-3 d-flex flex-wrap gap-2" style="border-top:1px solid var(--border-color);">
                <button type="button" id="renewNowBtn" class="btn btn-sm btn-success d-none">
                    <i class="fa-solid fa-rotate me-1"></i>Perpanjang Sekarang
                </button>
                <a href="/client/packages-catalog" class="btn btn-sm btn-outline-secondary">
                    <i class="fa-solid fa-plus me-1"></i>Beli Paket Baru
                </a>
            </div>
        </div>
    </div>

    <!-- Renew Confirmation Modal -->
    <div class="modal fade" id="renewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: var(--bg-panel); border: 1px solid var(--border-color);">
                <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
                    <h6 class="fw-bold mb-0" style="color: var(--text-heading);"><i class="fa-solid fa-rotate me-2"></i>Konfirmasi Perpanjangan</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" style="color:var(--text-heading);">Paket</label>
                        <select class="form-select" id="renewPackageSelect"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" style="color:var(--text-heading);">Durasi Perpanjangan</label>
                        <select class="form-select" id="renewDuration">
                            <option value="1">1 Bulan</option>
                            <option value="3">3 Bulan</option>
                            <option value="6">6 Bulan</option>
                            <option value="12">12 Bulan</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" style="color:var(--text-heading);">Metode Pembayaran</label>
                        <select class="form-select" id="renewPaymentMethod">
                            <option value="Transfer Bank">Transfer Bank</option>
                        </select>
                    </div>
                    <div class="renew-highlight mb-0">
                        <i class="fa-solid fa-calendar-day me-2" style="color:#00f2ff;"></i>
                        Masa aktif baru dimulai dari: <strong id="renewalStartDateText" style="color:var(--text-heading);">-</strong>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--border-color);">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-sm btn-success" id="submitRenewBtn">
                        <i class="fa-solid fa-check me-1"></i>Konfirmasi Perpanjangan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="toastEl" class="toast align-items-center text-white border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body fw-semibold" id="toastMsg">-</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <footer class="fixed-footer">
        <div>&copy; 2026 <strong>ThinkTala</strong>. All rights reserved.</div>
        <div>v1.3.0</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/za-theme.js"></script>
    <script src="/assets/js/client-layout.js"></script>
    <script>
        var subscriptionMap = {};
        var latestSubscription = null;
        var catalogPackages = [];
        var defaultPackageId = '';

        function formatIdDate(dateStr) {
            if (!dateStr) return '-';
            var d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return '-';
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        function showToast(msg, type) {
            var t = document.getElementById('toastEl');
            var m = document.getElementById('toastMsg');
            t.classList.remove('bg-success', 'bg-danger', 'bg-warning');
            t.classList.add(type === 'success' ? 'bg-success' : type === 'warning' ? 'bg-warning' : 'bg-danger');
            m.textContent = msg;
            bootstrap.Toast.getOrCreateInstance(t, { delay: 3500 }).show();
        }

        function computeRenewalStartDate(sub) {
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (sub && String(sub.status || '').toUpperCase() === 'ACTIVE' && sub.end_date) {
                var end = new Date(sub.end_date);
                var endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
                if (endDay >= today) return endDay;
            }
            return today;
        }

        function updateRenewalStartPreview() {
            var select = document.getElementById('renewPackageSelect');
            var pkgId = select ? select.value : '';
            var sub = subscriptionMap[pkgId] || latestSubscription;
            var start = computeRenewalStartDate(sub);
            document.getElementById('renewalStartDateText').textContent = start.toLocaleDateString('id-ID', {
                day: '2-digit', month: 'long', year: 'numeric'
            });
        }

        function normalizeSubscriptionsPayload(json) {
            if (Array.isArray(json.active_subscriptions)) return json.active_subscriptions;
            if (Array.isArray(json.data)) return json.data;
            if (json.data && typeof json.data === 'object') return [json.data];
            return [];
        }

        function renderSubscriptionOverview(json) {
            var badge = document.getElementById('subStatusBadge');
            var packageEl = document.getElementById('subPackageName');
            var startEl = document.getElementById('subStartDate');
            var endEl = document.getElementById('subEndDate');
            var listEl = document.getElementById('subPackagesList');
            var renewBtn = document.getElementById('renewNowBtn');

            var active = normalizeSubscriptionsPayload(json);
            latestSubscription = json.latest_subscription || (active.length ? active[0] : null);
            var canRenew = !!json.can_renew;

            subscriptionMap = {};
            active.forEach(function (s) {
                if (s && s.package_id) subscriptionMap[s.package_id] = s;
            });
            if (latestSubscription && latestSubscription.package_id) {
                subscriptionMap[latestSubscription.package_id] = latestSubscription;
            }

            if (active.length === 0 && !latestSubscription) {
                badge.textContent = 'Belum Berlangganan';
                packageEl.textContent = 'Belum Berlangganan';
                startEl.textContent = '-';
                endEl.textContent = '-';
                listEl.innerHTML = '<div class="text-muted small">Belum ada riwayat langganan.</div>';
                renewBtn.classList.add('d-none');
                return;
            }

            var display = active.length ? active[0] : latestSubscription;
            var status = String((display && display.status) || '').toUpperCase();
            badge.textContent = status === 'ACTIVE' ? 'ACTIVE' : (status === 'EXPIRED' ? 'EXPIRED' : status || '-');
            badge.style.background = status === 'ACTIVE' ? 'rgba(16,185,129,0.18)' : 'rgba(255,255,255,0.1)';
            badge.style.color = status === 'ACTIVE' ? '#34d399' : 'var(--text-muted)';

            packageEl.textContent = display.package_name || '-';
            startEl.textContent = formatIdDate(display.start_date);
            endEl.textContent = formatIdDate(display.end_date);
            defaultPackageId = display.package_id || '';

            if (active.length === 0) {
                listEl.innerHTML = '<div class="subscription-item"><div class="subscription-item-name">' +
                    (latestSubscription.package_name || '-') + '</div>' +
                    '<div class="subscription-item-meta">Periode: ' + formatIdDate(latestSubscription.start_date) +
                    ' - ' + formatIdDate(latestSubscription.end_date) + ' &middot; ' + status + '</div></div>';
            } else {
                listEl.innerHTML = active.map(function (item) {
                    return '<div class="subscription-item"><div class="subscription-item-name">' + (item.package_name || '-') +
                        '</div><div class="subscription-item-meta">Periode: ' + formatIdDate(item.start_date) +
                        ' - ' + formatIdDate(item.end_date) + '</div></div>';
                }).join('');
            }

            renewBtn.classList.toggle('d-none', !canRenew);
        }

        async function loadCatalogPackages() {
            try {
                var res = await fetch('/api/subscription/catalog', { credentials: 'include' });
                if (!res.ok) return;
                var json = await res.json();
                var list = (json && json.success && Array.isArray(json.data)) ? json.data : (Array.isArray(json.data) ? json.data : []);
                catalogPackages = list.filter(function (p) {
                    return String(p.status || 'ACTIVE').toUpperCase() === 'ACTIVE';
                });
            } catch (e) {
                catalogPackages = [];
            }
        }

        function populateRenewPackageSelect() {
            var select = document.getElementById('renewPackageSelect');
            if (!select) return;
            if (!catalogPackages.length) {
                select.innerHTML = '<option value="">Tidak ada paket aktif</option>';
                return;
            }
            select.innerHTML = catalogPackages.map(function (p) {
                var id = p.id || p.package_id || '';
                var name = p.name || p.package_name || 'Paket';
                return '<option value="' + id + '">' + name + '</option>';
            }).join('');
            if (defaultPackageId) {
                select.value = defaultPackageId;
            }
            updateRenewalStartPreview();
        }

        function openRenewModal() {
            populateRenewPackageSelect();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('renewModal')).show();
        }

        async function submitRenew() {
            var btn = document.getElementById('submitRenewBtn');
            var packageId = document.getElementById('renewPackageSelect').value;
            var duration = parseInt(document.getElementById('renewDuration').value, 10) || 1;
            var paymentMethod = document.getElementById('renewPaymentMethod').value;

            if (!packageId) {
                showToast('Pilih paket terlebih dahulu.', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>Memproses...';

            try {
                var res = await fetch('/api/orders/renew', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        package_id: packageId,
                        duration_months: duration,
                        payment_method: paymentMethod
                    })
                });
                var json = await res.json();
                bootstrap.Modal.getOrCreateInstance(document.getElementById('renewModal')).hide();

                if (res.ok && json.success) {
                    sessionStorage.setItem('billingToast', 'Pesanan perpanjangan berhasil dibuat. Menunggu verifikasi pembayaran.');
                    window.location.href = '/client/billing-history';
                    return;
                }
                showToast((json && json.error_message) ? json.error_message : 'Gagal mengajukan perpanjangan.', 'danger');
            } catch (e) {
                showToast('Gagal terhubung ke server.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check me-1"></i>Konfirmasi Perpanjangan';
            }
        }

        async function loadSubscriptionStatus() {
            try {
                var res = await fetch('/api/subscriptions/me', { credentials: 'include' });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/account/login';
                    return;
                }
                var json = await res.json();
                if (!json.success) {
                    renderSubscriptionOverview({ active_subscriptions: [], can_renew: false });
                    return;
                }
                renderSubscriptionOverview(json);
            } catch (e) {
                document.getElementById('subPackagesList').innerHTML = '<div class="text-danger small">Gagal memuat status langganan.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadCatalogPackages().then(loadSubscriptionStatus);
            document.getElementById('renewNowBtn').addEventListener('click', openRenewModal);
            document.getElementById('submitRenewBtn').addEventListener('click', submitRenew);
            document.getElementById('renewPackageSelect').addEventListener('change', updateRenewalStartPreview);
            document.getElementById('renewDuration').addEventListener('change', updateRenewalStartPreview);

            var toastMsg = sessionStorage.getItem('billingToast');
            if (toastMsg) {
                sessionStorage.removeItem('billingToast');
                setTimeout(function () { showToast(toastMsg, 'success'); }, 400);
            }
        });
    </script>
</body>

</html>
