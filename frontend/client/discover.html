<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | ThinkTala Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        .discover-page {
            position: relative;
            isolation: isolate;
            --discover-content-pad: 30px;
        }

        .discover-page::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 360px;
            pointer-events: none;
            background: radial-gradient(circle at top right, rgba(0, 242, 255, 0.18), rgba(0, 242, 255, 0));
            z-index: -1;
        }

        .discover-page::after {
            content: "";
            position: absolute;
            top: 120px;
            left: calc(-1 * var(--discover-content-pad));
            width: calc(65% + var(--discover-content-pad));
            height: 280px;
            pointer-events: none;
            background: radial-gradient(circle at center left, rgba(0, 242, 255, 0.07), rgba(0, 242, 255, 0));
            z-index: -1;
        }

        .main-content.discover-page {
            padding-bottom: 120px;
        }

        .discover-hero-kicker {
            width: 44px;
            height: 4px;
            border-radius: 999px;
            margin-bottom: 14px;
            background: linear-gradient(90deg, #00f2ff 0%, rgba(0, 242, 255, 0.2) 100%);
            box-shadow: 0 0 16px rgba(0, 242, 255, 0.45);
        }

        .discover-title {
            font-size: clamp(1.8rem, 2.8vw, 2.9rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
            color: var(--text-heading);
        }

        .discover-subtitle {
            color: var(--text-muted);
            font-size: 1.02rem;
            margin-bottom: 0;
        }

        .discover-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        .discover-tabs {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .discover-tab {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 10px;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .discover-tab:hover {
            color: var(--text-main);
        }

        .discover-tab.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            text-shadow: 0 0 14px rgba(0, 242, 255, 0.55);
        }

        .discover-search {
            min-width: 260px;
            max-width: 320px;
            flex: 1;
            margin-left: auto;
            border: 1px solid var(--border-color);
            background: rgba(9, 14, 25, 0.85);
            border-radius: 12px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .discover-search i {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .discover-search input {
            border: none;
            background: transparent;
            color: var(--text-main);
            width: 100%;
            font-size: 0.92rem;
            outline: none;
        }

        .discover-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--accent-cyan);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .discover-section-title::after {
            content: "";
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.45), transparent);
            flex: 1;
        }

        .discover-section-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.8);
        }

        .featured-grid {
            margin-bottom: 26px;
        }

        .featured-card {
            border: 1px solid rgba(0, 242, 255, 0.28);
            border-radius: 18px;
            background: linear-gradient(165deg, rgba(17, 28, 45, 0.95), rgba(10, 14, 22, 0.92));
            box-shadow: 0 0 0 1px rgba(0, 242, 255, 0.06) inset, 0 16px 36px rgba(0, 0, 0, 0.36);
            min-height: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .featured-card::before {
            content: "";
            position: absolute;
            right: -80px;
            top: -80px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.12), rgba(0, 242, 255, 0));
            pointer-events: none;
        }

        .featured-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.42);
        }

        .featured-card,
        .recent-item {
            cursor: pointer;
        }

        .featured-media {
            position: relative;
            min-height: 320px;
            --featured-image: none;
            background-color: #0b0f19;
            background-image:
                var(--featured-image),
                radial-gradient(circle at 30% 20%, rgba(120, 255, 228, 0.18), rgba(7, 12, 20, 0.9)),
                linear-gradient(160deg, rgba(20, 26, 40, 0.98), rgba(6, 9, 16, 0.98));
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 24px;
        }

        .featured-media::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(6, 9, 16, 0.2), rgba(6, 9, 16, 0.92));
            pointer-events: none;
        }

        .featured-body {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 520px;
        }

        .featured-topline {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .featured-chip {
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }

        .featured-chip.pinned {
            color: #ffe870;
            border: 1px solid rgba(255, 232, 112, 0.55);
            background: rgba(152, 122, 28, 0.25);
        }

        .featured-title {
            font-size: clamp(1.5rem, 1.7vw, 2.2rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin: 0;
            color: #f8fbff;
        }

        .featured-desc {
            font-size: 0.98rem;
            line-height: 1.65;
            color: rgba(220, 234, 255, 0.75);
            margin: 0;
        }

        .featured-desc h1,
        .featured-desc h2,
        .featured-desc h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            line-height: 1.35;
        }

        .featured-desc p,
        .featured-desc ul,
        .featured-desc ol {
            margin: 0 0 8px;
        }

        .featured-meta {
            font-size: 0.84rem;
            color: rgba(181, 201, 227, 0.75);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .featured-author {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #f2f7ff;
        }

        .featured-type {
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .featured-type.type-promo {
            color: #88ff47;
            border: 1px solid rgba(136, 255, 71, 0.45);
            background: rgba(67, 144, 25, 0.25);
        }

        .featured-type.type-analysis {
            color: #2be8ff;
            border: 1px solid rgba(43, 232, 255, 0.45);
            background: rgba(18, 126, 139, 0.3);
        }

        .featured-type.type-feature {
            color: #ffe870;
            border: 1px solid rgba(255, 232, 112, 0.45);
            background: rgba(152, 122, 28, 0.25);
        }

        .featured-type.type-info {
            color: #7dd3fc;
            border: 1px solid rgba(125, 211, 252, 0.45);
            background: rgba(14, 76, 122, 0.28);
        }

        .featured-type.type-warning {
            color: #ffb347;
            border: 1px solid rgba(255, 179, 71, 0.45);
            background: rgba(144, 88, 18, 0.25);
        }

        .featured-type.type-system {
            color: #b8c0ff;
            border: 1px solid rgba(184, 192, 255, 0.45);
            background: rgba(66, 80, 144, 0.25);
        }

        .featured-type.type-event {
            color: #7ef29a;
            border: 1px solid rgba(126, 242, 154, 0.45);
            background: rgba(33, 120, 78, 0.22);
        }

        .featured-type.type-education {
            color: #6ee7b7;
            border: 1px solid rgba(110, 231, 183, 0.45);
            background: rgba(24, 120, 86, 0.22);
        }

        .featured-actions {
            margin-top: 6px;
        }

        .featured-readmore {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent-cyan);
        }

        .featured-cta {
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00f2ff, #07d8df);
            color: #04151f;
            text-decoration: none;
            font-weight: 800;
            letter-spacing: 0.02em;
            padding: 11px 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .featured-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 242, 255, 0.32);
            color: #04151f;
        }

        .recent-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 12px;
            letter-spacing: -0.015em;
        }

        .recent-panel {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: rgba(12, 18, 30, 0.9);
            overflow: hidden;
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.26);
        }

        .recent-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 22px;
            align-items: stretch;
            padding: 22px 20px;
            min-height: 196px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .recent-item:last-child {
            border-bottom: none;
        }

        .recent-item:hover {
            background: rgba(0, 242, 255, 0.04);
        }

        .recent-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            gap: 10px;
        }

        .recent-author-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: rgba(202, 219, 241, 0.92);
            font-size: 0.88rem;
            min-height: 24px;
        }

        .recent-author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.07);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #e8f2ff;
            text-transform: uppercase;
        }

        .recent-author-name {
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .recent-media {
            width: 100%;
            min-height: 132px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .recent-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recent-media.recent-media-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.65rem;
        }

        .recent-item-title {
            margin: 0;
            font-size: clamp(1.3rem, 1.45vw, 1.7rem);
            font-weight: 800;
            line-height: 1.25;
            color: #f4f9ff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .recent-item-type {
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .recent-item-type.type-promo {
            color: #88ff47;
            border: 1px solid rgba(136, 255, 71, 0.35);
            background: rgba(67, 144, 25, 0.2);
        }

        .recent-item-type.type-analysis {
            color: #2be8ff;
            border: 1px solid rgba(43, 232, 255, 0.35);
            background: rgba(18, 126, 139, 0.24);
        }

        .recent-item-type.type-feature {
            color: #ffe870;
            border: 1px solid rgba(255, 232, 112, 0.35);
            background: rgba(152, 122, 28, 0.2);
        }

        .recent-item-type.type-info {
            color: #7dd3fc;
            border: 1px solid rgba(125, 211, 252, 0.35);
            background: rgba(14, 76, 122, 0.24);
        }

        .recent-item-type.type-warning {
            color: #ffb347;
            border: 1px solid rgba(255, 179, 71, 0.35);
            background: rgba(144, 88, 18, 0.2);
        }

        .recent-item-type.type-system {
            color: #b8c0ff;
            border: 1px solid rgba(184, 192, 255, 0.35);
            background: rgba(66, 80, 144, 0.2);
        }

        .recent-item-type.type-event {
            color: #7ef29a;
            border: 1px solid rgba(126, 242, 154, 0.35);
            background: rgba(33, 120, 78, 0.18);
        }

        .recent-item-type.type-education {
            color: #6ee7b7;
            border: 1px solid rgba(110, 231, 183, 0.35);
            background: rgba(24, 120, 86, 0.18);
        }

        .recent-item-desc {
            margin: 0;
            color: rgba(225, 236, 255, 0.58);
            font-size: 0.99rem;
            line-height: 1.55;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .recent-item-desc h1,
        .recent-item-desc h2,
        .recent-item-desc h3 {
            margin: 0 0 6px;
            font-size: 1rem;
            line-height: 1.35;
        }

        .recent-item-desc p,
        .recent-item-desc ul,
        .recent-item-desc ol {
            margin: 0 0 8px;
        }

        .recent-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 4px;
        }

        .recent-meta {
            color: rgba(181, 201, 227, 0.72);
            font-size: 0.84rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .recent-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .recent-meta i {
            color: rgba(163, 191, 223, 0.78);
            font-size: 0.82rem;
        }

        .recent-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .recent-link:hover {
            color: #67f8ff;
        }

        .recent-readmore {
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .discover-detail-view {
            max-width: 920px;
            margin: 0 auto;
            display: none;
        }

        .detail-back {
            border: none;
            background: transparent;
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .detail-hero {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .detail-title {
            font-size: clamp(2rem, 3vw, 2.6rem);
            font-weight: 800;
            color: var(--text-heading);
            margin: 0;
        }

        .detail-meta {
            color: var(--text-muted);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .detail-media {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.03);
        }

        .detail-media img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .detail-content {
            color: rgba(220, 234, 255, 0.75);
            font-size: 1rem;
            line-height: 1.7;
        }

        .detail-content h1,
        .detail-content h2,
        .detail-content h3 {
            color: #f4f9ff;
            margin: 18px 0 10px;
        }

        .detail-content ul,
        .detail-content ol {
            padding-left: 22px;
        }

        /* Quill-generated markup on client */
        .detail-content a {
            color: #00f2ff;
            text-decoration: underline;
        }

        .detail-content a:hover {
            color: #67f8ff;
        }

        .detail-content blockquote {
            border-left: 3px solid rgba(0, 242, 255, 0.45);
            margin: 12px 0;
            padding: 8px 16px;
            color: rgba(200, 220, 255, 0.6);
            background: rgba(0, 242, 255, 0.04);
            border-radius: 0 6px 6px 0;
        }

        .detail-content pre {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 14px 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: #7ee787;
            margin: 12px 0;
        }

        .detail-content code {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #79d4ff;
        }

        /* Also apply detail-content styles inside the modal body */
        .news-modal-body a {
            color: #00f2ff;
            text-decoration: underline;
        }

        .news-modal-body blockquote {
            border-left: 3px solid rgba(0, 242, 255, 0.45);
            margin: 10px 0;
            padding: 8px 14px;
            color: rgba(200, 220, 255, 0.6);
            background: rgba(0, 242, 255, 0.04);
            border-radius: 0 6px 6px 0;
        }

        .news-modal-body pre {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px 14px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.86rem;
            color: #7ee787;
            margin: 10px 0;
        }

        .news-modal-body code {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #79d4ff;
        }

        .detail-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00f2ff, #07d8df);
            color: #04151f;
            font-weight: 800;
            letter-spacing: 0.02em;
            padding: 12px 20px;
            text-decoration: none;
        }

        /* ── News Modal ─────────────────────────────────────── */
        .news-modal-dialog {
            max-width: 560px;
            width: 100%;
        }

        .news-modal-content {
            background: linear-gradient(160deg, rgba(14, 22, 38, 0.98), rgba(8, 12, 22, 0.99));
            border: 1px solid rgba(0, 242, 255, 0.22);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(0, 242, 255, 0.06) inset,
                0 28px 56px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(0, 242, 255, 0.06);
            overflow: hidden;
        }

        .news-modal-header {
            padding: 22px 24px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 242, 255, 0.03);
        }

        .news-modal-header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .news-modal-badge {
            min-height: 22px;
        }

        .news-modal-close {
            border: none;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(200, 220, 255, 0.7);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .news-modal-close:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #f0f8ff;
        }

        .news-modal-title {
            font-size: clamp(1.1rem, 2.2vw, 1.45rem);
            font-weight: 800;
            color: #f4f9ff;
            margin: 0 0 10px;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .news-modal-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            color: rgba(181, 201, 227, 0.65);
            font-size: 0.82rem;

    <script>
        const DISCOVER_FALLBACK = [
            {
                id: 'short-maintenance',
                title: 'Maintenance Window Tonight',
                description: 'Platform will be briefly unavailable at 23:00-23:20 WIB. Trading and dashboard will resume normally.',
                type: 'system',
                has_detail: false,
                cta_url: 'https://www.thinktala.com/status',
                created_at: '2026-05-10T11:00:00Z'
            },
            {
                id: 'long-risk-playbook',
                title: 'Risk Management Playbook for New Traders',
                excerpt: 'A practical guide to position sizing, stop losses, and risk checks you can apply today.',
                description: '<h2>Why it matters</h2><p>Markets can move fast. A simple risk routine keeps your decisions consistent and protects capital when volatility spikes.</p><h3>Core checklist</h3><ul><li>Set a max loss per trade (1-2% of capital).</li><li>Use a stop loss before entering the trade.</li><li>Size the position based on stop distance.</li><li>Take partial profits at predefined levels.</li></ul><p><strong>Pro tip:</strong> Write your rule set and review it weekly. Small adjustments compound quickly.</p><h3>Example workflow</h3><p>Plan the entry, define the stop, calculate size, and log the outcome. Repeat this sequence to build a stable edge.</p>',
                full_content: '<h2>Why it matters</h2><p>Markets can move fast. A simple risk routine keeps your decisions consistent and protects capital when volatility spikes.</p><h3>Core checklist</h3><ul><li>Set a max loss per trade (1-2% of capital).</li><li>Use a stop loss before entering the trade.</li><li>Size the position based on stop distance.</li><li>Take partial profits at predefined levels.</li></ul><p><strong>Pro tip:</strong> Write your rule set and review it weekly. Small adjustments compound quickly.</p><h3>Example workflow</h3><p>Plan the entry, define the stop, calculate size, and log the outcome. Repeat this sequence to build a stable edge.</p>',
                type: 'education',
                has_detail: true,
                image_url: '/assets/img/ecosystem.png',
                author: 'ThinkTala Academy',
                cta_url: 'https://www.thinktala.com/learn/risk-playbook',
                created_at: '2026-05-09T08:00:00Z'
            }
        ];

        const DISCOVER_STATE = {
            allItems: [],
            activeFilter: 'all',
            keyword: ''
        };

        const DETAIL_API_BASE = '/api/notifications';
        let currentDetailId = '';

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function stripHtml(value) {
            const div = document.createElement('div');
            div.innerHTML = value == null ? '' : String(value);
            return div.textContent || '';
        }

        /**
         * Auto-detect whether an article needs a Full Page or a Modal.
         * Rules:
         *   - has an image_url                       → Full Page
         *   - contains complex HTML (h1-h6, ul, ol,
         *     img, table, figure)                    → Full Page
         *   - plain/rich text > 1 000 characters     → Full Page
         *   - everything else                        → Modal
         */
        const COMPLEX_TAG_RE = /<(h[1-6]|ul|ol|li|img|table|figure|blockquote)/i;
        const CHAR_THRESHOLD  = 1000;

        function shouldUseFullPage(item) {
            if (item.imageUrl) return true;
            const content = String(item.fullContent || item.description || '').trim();
            if (COMPLEX_TAG_RE.test(content)) return true;
            const plainLen = stripHtml(content).length;
            return plainLen > CHAR_THRESHOLD;
        }

        // Tags that Quill can produce — all safe for rendering
        const ALLOWED_DESC_TAGS = new Set([
            'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'BR',
            'P', 'H1', 'H2', 'H3', 'H4',
            'UL', 'OL', 'LI',
            'SPAN',         // Quill uses span for color/size/font
            'A',            // Links inserted via Quill link tool
            'PRE', 'CODE',  // Code blocks
            'BLOCKQUOTE'    // Blockquotes
        ]);

        // Inline style properties that are safe to preserve on <span>
        const ALLOWED_STYLE_PROPS = new Set([
            'color', 'background-color', 'font-size', 'font-family',
            'font-weight', 'font-style', 'text-decoration'
        ]);

        function sanitizeStyleAttr(styleStr) {
            if (!styleStr) return '';
            return styleStr.split(';').map(function (decl) {
                const colon = decl.indexOf(':');
                if (colon < 0) return '';
                const prop = decl.slice(0, colon).trim().toLowerCase();
                const val  = decl.slice(colon + 1).trim();
                // Block javascript: and expression() in values
                if (/javascript|expression|url\s*\(/i.test(val)) return '';
                if (ALLOWED_STYLE_PROPS.has(prop)) return prop + ':' + val;
                return '';
            }).filter(Boolean).join(';');
        }

        function sanitizeRichText(value) {
            const raw = String(value || '');
            if (!raw) return '';
            const template = document.createElement('template');
            template.innerHTML = raw;

            const nodes = [];
            const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT, null);
            while (walker.nextNode()) {
                nodes.push(walker.currentNode);
            }

            // Process deepest nodes first to avoid breaking parent references
            nodes.reverse().forEach(function (el) {
                const tag = el.tagName;
                if (!ALLOWED_DESC_TAGS.has(tag)) {
                    // Unwrap: keep inner text/children, remove the element
                    const frag = document.createDocumentFragment();
                    while (el.firstChild) frag.appendChild(el.firstChild);
                    el.parentNode.replaceChild(frag, el);
                    return;
                }

                // Strip all attributes, then restore safe ones
                const attrsToKeep = {};
                if (tag === 'SPAN') {
                    const style = sanitizeStyleAttr(el.getAttribute('style'));
                    if (style) attrsToKeep['style'] = style;
                    const cls = el.getAttribute('class') || '';
                    // Quill uses class="ql-font-*" etc.
                    if (cls && /^ql-/.test(cls.trim())) attrsToKeep['class'] = cls;
                }
                if (tag === 'A') {
                    const href = (el.getAttribute('href') || '').trim();
                    try {
                        const parsed = new URL(href, window.location.origin);
                        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                            attrsToKeep['href']   = parsed.href;
                            attrsToKeep['target'] = '_blank';
                            attrsToKeep['rel']    = 'noopener noreferrer';
                        }
                    } catch (_) {}
                }

                while (el.attributes.length > 0) {
                    el.removeAttribute(el.attributes[0].name);
                }
                Object.keys(attrsToKeep).forEach(function (attr) {
                    el.setAttribute(attr, attrsToKeep[attr]);
                });
            });

            return template.innerHTML;
        }

        function renderDescription(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            if (!/[<>]/.test(raw)) return escapeHtml(raw);
            const sanitized = sanitizeRichText(raw);
            return sanitized || escapeHtml(raw);
        }

        function safeUrl(value) {
            if (!value) return '';
            try {
                const parsed = new URL(value, window.location.origin);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                    return parsed.href;
                }
                return '';
            } catch (err) {
                return '';
            }
        }

        function safeImageUrl(value) {
            const raw = String(value || '').trim();
            if (!raw) return '';
            if (raw.startsWith('data:image/')) return raw;
            if (raw.startsWith('http://') || raw.startsWith('https://')) return raw;
            if (raw.startsWith('/')) return raw;
            if (raw.startsWith('assets/') || raw.startsWith('uploads/')) return '/' + raw;

            const url = safeUrl(raw);
            return url || '';
        }

        function toDate(value) {
            if (!value) return null;
            const dt = new Date(value);
            const time = dt.getTime();
            if (Number.isNaN(time) || time <= 0) return null;
            return dt;
        }

        function relativeTime(dt) {
            if (!dt) return 'Unknown time';
            const deltaMs = Date.now() - dt.getTime();
            const minutes = Math.max(1, Math.floor(deltaMs / 60000));
            if (minutes < 60) return minutes + ' min ago';
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return hours + ' hour' + (hours > 1 ? 's' : '') + ' ago';
            const days = Math.floor(hours / 24);
            return days + ' day' + (days > 1 ? 's' : '') + ' ago';
        }

        function shortDate(dt) {
            if (!dt) return '';
            return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function estimateReadTime(text) {
            const plain = stripHtml(text || '');
            const words = String(plain).trim().split(/\s+/).filter(Boolean).length;
            if (words === 0) return '1 min read';
            return Math.max(1, Math.round(words / 35)) + ' min read';
        }

        function normalizeType(rawType) {
            const t = String(rawType || '').toLowerCase();
            if (t.includes('promo')) return 'promo';
            if (t.includes('education')) return 'education';
            if (t.includes('analysis')) return 'analysis';
            if (t.includes('warning')) return 'warning';
            if (t.includes('info')) return 'info';
            if (t.includes('system')) return 'system';
            if (t.includes('event')) return 'event';
            if (t.includes('feature') || t.includes('update')) return 'feature';
            return 'info';
        }

        function typeMeta(type) {
            if (type === 'promo') {
                return {
                    className: 'type-promo',
                    label: 'Promo',
                    icon: 'fa-solid fa-gift',
                    iconColor: '#88ff47',
                    actionText: 'Read Terms'
                };
            }
            if (type === 'analysis') {
                return {
                    className: 'type-analysis',
                    label: 'Analysis',
                    icon: 'fa-solid fa-chart-column',
                    iconColor: '#2be8ff',
                    actionText: 'Open Full Report'
                };
            }
            if (type === 'warning') {
                return {
                    className: 'type-warning',
                    label: 'Warning',
                    icon: 'fa-solid fa-triangle-exclamation',
                    iconColor: '#ffb347',
                    actionText: 'Read Update'
                };
            }
            if (type === 'info') {
                return {
                    className: 'type-info',
                    label: 'Info',
                    icon: 'fa-solid fa-circle-info',
                    iconColor: '#7dd3fc',
                    actionText: 'Read Update'
                };
            }
            if (type === 'system') {
                return {
                    className: 'type-system',
                    label: 'System',
                    icon: 'fa-solid fa-shield-halved',
                    iconColor: '#b8c0ff',
                    actionText: 'Read Update'
                };
            }
            if (type === 'event') {
                return {
                    className: 'type-event',
                    label: 'Event',
                    icon: 'fa-solid fa-calendar-days',
                    iconColor: '#7ef29a',
                    actionText: 'View Details'
                };
            }
            if (type === 'education') {
                return {
                    className: 'type-education',
                    label: 'Education',
                    icon: 'fa-solid fa-book-open',
                    iconColor: '#6ee7b7',
                    actionText: 'Start Learning'
                };
            }
            return {
                className: 'type-feature',
                label: 'Feature',
                icon: 'fa-solid fa-bullhorn',
                iconColor: '#ffe870',
                actionText: 'Read More'
            };
        }

        function parseNotification(item, index) {
            const title = String(item.title || '').trim();
            const preview = String(item.excerpt || item.description || item.message || '').trim();
            if (!title && !preview) return null;

            const type = normalizeType(item.type);
            const created = toDate(item.created_at);
            const expire = toDate(item.expiry_date);
            const author = String(item.author || item.author_name || item.source || '').trim();
            const fullContent = String(item.full_content || item.fullContent || item.description || item.message || '').trim();
            const imageUrl = safeImageUrl(item.image_url);

            // Build a temporary normalised object so shouldUseFullPage can inspect it
            const partial = {
                imageUrl:    imageUrl,
                fullContent: fullContent,
                description: preview
            };
            // Explicit flag from backend overrides auto-detection
            const explicitDetail = item.has_detail != null ? Boolean(item.has_detail)
                                 : item.hasDetail != null  ? Boolean(item.hasDetail)
                                 : item.is_long_content != null ? Boolean(item.is_long_content)
                                 : null;
            const hasDetail = explicitDetail !== null ? explicitDetail : shouldUseFullPage(partial);

            return {
                id: item.id || ('notification-' + index),
                title: title || 'Untitled update',
                description: preview || 'No description available.',
                type: type,
                createdAt: created,
                expiryAt: expire,
                ctaUrl: safeUrl(item.cta_url),
                imageUrl: imageUrl,
                author: author,
                isPinned: Boolean(item.is_pinned || item.isPinned || item.pinned),
                hasDetail: hasDetail,
                fullContent: fullContent
            };
        }

        function normalizeDetailItem(item) {
            const title = String(item.title || '').trim();
            const description = String(item.description || item.message || '').trim();
            const fullContent = String(item.full_content || item.fullContent || item.description || item.message || '').trim();
            const type = normalizeType(item.type);
            const created = toDate(item.created_at);
            const expire = toDate(item.expiry_date);
            const author = String(item.author || item.author_name || item.source || '').trim();
            const imageUrl = safeImageUrl(item.image_url);

            const partial = { imageUrl, fullContent, description };
            const explicitDetail = item.has_detail != null ? Boolean(item.has_detail)
                                 : item.hasDetail != null  ? Boolean(item.hasDetail)
                                 : item.is_long_content != null ? Boolean(item.is_long_content)
                                 : null;
            const hasDetail = explicitDetail !== null ? explicitDetail : shouldUseFullPage(partial);

            return {
                id: item.id || '',
                title: title || 'Untitled update',
                description: description || 'No description available.',
                fullContent: fullContent,
                type: type,
                createdAt: created,
                expiryAt: expire,
                ctaUrl: safeUrl(item.cta_url),
                imageUrl: imageUrl,
                author: author,
                isPinned: Boolean(item.is_pinned || item.isPinned || item.pinned),
                hasDetail: hasDetail
            };
        }

        async function fetchNotificationDetail(id) {
            const query = getNotificationQuery();
            const endpoint = DETAIL_API_BASE + '/' + encodeURIComponent(id) + (query ? ('?' + query) : '');

            const res = await fetch(endpoint, {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (!res.ok) {
                throw new Error('Failed with status ' + res.status);
            }

            const json = await res.json();
            return json.data || null;
        }

        function setViewMode(mode) {
            const listView = document.getElementById('discoverListView');
            const detailView = document.getElementById('discoverDetailView');
            if (listView) listView.style.display = mode === 'detail' ? 'none' : '';
            // Must use 'block' (not '') — empty string falls back to CSS class display:none
            if (detailView) detailView.style.display = mode === 'detail' ? 'block' : 'none';
        }

        function setDetailHistory(id) {
            if (!id) return;
            currentDetailId = id;
            history.pushState({ detailId: id }, '', '#news/' + encodeURIComponent(id));
        }

        function clearDetailHistory() {
            currentDetailId = '';
            history.pushState({}, '', window.location.pathname + window.location.search);
        }

        function getDetailIdFromLocation() {
            if (window.location.hash.indexOf('#news/') !== 0) return '';
            return decodeURIComponent(window.location.hash.replace('#news/', '').trim());
        }

        function showDetailView(detail, pushHistory) {
            setViewMode('detail');
            if (pushHistory) {
                setDetailHistory(detail.id);
            }

            const meta = typeMeta(detail.type);
            const typeBadge = document.getElementById('detailTypeBadge');
            if (typeBadge) {
                typeBadge.innerHTML = '<span class="featured-type ' + meta.className + '">' + escapeHtml(meta.label) + '</span>';
            }
            const titleEl = document.getElementById('detailTitle');
            if (titleEl) titleEl.textContent = detail.title || '';

            const metaEl = document.getElementById('detailMeta');
            const published = detail.createdAt ? shortDate(detail.createdAt) : '';
            const expiry = detail.expiryAt ? ('Expires ' + shortDate(detail.expiryAt)) : '';
            const author = detail.author ? escapeHtml(detail.author) : '';
            if (metaEl) {
                const parts = [];
                if (author) parts.push('<span><i class="fa-regular fa-user"></i>' + author + '</span>');
                if (published) parts.push('<span><i class="fa-regular fa-calendar"></i>' + escapeHtml(published) + '</span>');
                if (expiry) parts.push('<span><i class="fa-regular fa-clock"></i>' + escapeHtml(expiry) + '</span>');
                metaEl.innerHTML = parts.join('');
            }

            const media = document.getElementById('detailMedia');
            const imageEl = document.getElementById('detailImage');
            if (detail.imageUrl) {
                if (imageEl) imageEl.src = detail.imageUrl;
                if (media) media.style.display = '';
            } else if (media) {
                media.style.display = 'none';
            }

            const contentEl = document.getElementById('detailContent');
            if (contentEl) {
                // Prefer fullContent (complete article) over the short description preview
                const body = (detail.fullContent && detail.fullContent.length > detail.description.length)
                    ? detail.fullContent
                    : detail.description;
                contentEl.innerHTML = renderDescription(body);
            }

            const ctaEl = document.getElementById('detailCta');
            if (ctaEl) {
                if (detail.ctaUrl) {
                    ctaEl.href = detail.ctaUrl;
                    ctaEl.style.display = '';
                } else {
                    ctaEl.style.display = 'none';
                }
            }

            window.scrollTo(0, 0);
        }

        function showListView(pushHistory) {
            setViewMode('list');
            if (pushHistory) {
                clearDetailHistory();
            }
            window.scrollTo(0, 0);
        }

        function openShortModal(detail) {
            const titleEl = document.getElementById('newsModalTitle');
            const bodyEl  = document.getElementById('newsModalBody');
            const ctaEl   = document.getElementById('newsModalCta');
            const metaEl  = document.getElementById('newsModalMeta');
            const badgeEl = document.getElementById('newsModalBadge');

            if (titleEl) titleEl.textContent = detail.title || '';

            if (badgeEl) {
                const meta = typeMeta(detail.type);
                badgeEl.innerHTML = '<span class="recent-item-type ' + meta.className + '">' + escapeHtml(meta.label) + '</span>';
            }

            if (metaEl) {
                const parts = [];
                if (detail.author) parts.push('<span><i class="fa-regular fa-user"></i> ' + escapeHtml(detail.author) + '</span>');
                if (detail.createdAt) parts.push('<span><i class="fa-regular fa-calendar"></i> ' + escapeHtml(shortDate(detail.createdAt)) + '</span>');
                metaEl.innerHTML = parts.join('<span class="modal-meta-sep">·</span>');
            }

            if (bodyEl) bodyEl.innerHTML = renderDescription(detail.description);

            if (ctaEl) {
                if (detail.ctaUrl) {
                    ctaEl.href = detail.ctaUrl;
                    ctaEl.style.display = '';
                } else {
                    ctaEl.style.display = 'none';
                }
            }
            const modal = new bootstrap.Modal(document.getElementById('newsModal'));
            modal.show();
        }

        function openNotificationById(id, pushHistory) {
            if (!id) return;
            fetchNotificationDetail(id)
                .then(function (raw) {
                    if (!raw) throw new Error('Empty response');
                    const detail = normalizeDetailItem(raw);
                    if (detail.hasDetail) {
                        showDetailView(detail, pushHistory);
                    } else {
                        openShortModal(detail);
                    }
                })
                .catch(function () {
                    const local = (DISCOVER_STATE.allItems || []).find(function (item) {
                        return item.id === id;
                    });
                    if (local) {
                        const detail = {
                            id:          local.id,
                            title:       local.title,
                            description: local.description || '',
                            fullContent: local.fullContent || local.description || '',
                            type:        local.type,
                            createdAt:   local.createdAt,
                            expiryAt:    local.expiryAt,
                            ctaUrl:      local.ctaUrl,
                            imageUrl:    local.imageUrl,
                            author:      local.author,
                            isPinned:    local.isPinned,
                            hasDetail:   local.hasDetail
                        };
                        // Re-check using runtime rule (covers edge-cases from cached data)
                        const useFullPage = detail.hasDetail || shouldUseFullPage(detail);
                        if (useFullPage) {
                            showDetailView(detail, pushHistory);
                        } else {
                            openShortModal(detail);
                        }
                        return;
                    }
                    alert('Gagal memuat detail berita.');
                });
        }

        function bindCardClicks() {
            document.querySelectorAll('[data-news-id]').forEach(function (card) {
                card.addEventListener('click', function () {
                    const id = card.getAttribute('data-news-id');
                    openNotificationById(id, true);
                });
            });
            document.querySelectorAll('.featured-cta, .recent-link').forEach(function (link) {
                link.addEventListener('click', function (event) {
                    event.stopPropagation();
                });
            });
        }

        function getNotificationQuery() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const roleRaw = (user.role_code || user.level_code || user.level || 'CLIENT');
                const role = String(roleRaw).trim().toLowerCase() || 'client';
                const userId = String(user.id || '').trim();

                const params = new URLSearchParams();
                params.set('role', role);
                if (userId) params.set('user_id', userId);
                return params.toString();
            } catch (err) {
                return 'role=client';
            }
        }

        async function fetchNotifications() {
            const query = getNotificationQuery();
            const endpoint = '/api/notifications/public?' + query;

            const res = await fetch(endpoint, {
                credentials: 'include',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (!res.ok) {
                throw new Error('Failed with status ' + res.status);
            }

            const contentType = String(res.headers.get('content-type') || '').toLowerCase();
            if (!contentType.includes('application/json')) {
                throw new Error('Non-JSON response');
            }

            const json = await res.json();
            return Array.isArray(json.data) ? json.data : [];
        }

        function applyCountToSidebar(total) {
            if (typeof window.setClientDiscoverCount === 'function') {
                window.setClientDiscoverCount(total);
                return;
            }
            localStorage.setItem('client_discover_count', String(Math.max(0, total || 0)));
        }

        function getFilteredItems() {
            const keyword = DISCOVER_STATE.keyword.toLowerCase().trim();
            return DISCOVER_STATE.allItems.filter(function (item) {
                let byFilter = false;
                if (DISCOVER_STATE.activeFilter === 'all') {
                    byFilter = true;
                } else if (DISCOVER_STATE.activeFilter === 'promo') {
                    byFilter = ['promo', 'event'].includes(item.type);
                } else if (DISCOVER_STATE.activeFilter === 'education') {
                    byFilter = item.type === 'education';
                } else if (DISCOVER_STATE.activeFilter === 'updates') {
                    byFilter = ['system', 'info', 'warning'].includes(item.type);
                } else {
                    byFilter = item.type === DISCOVER_STATE.activeFilter;
                }
                if (!byFilter) return false;
                if (!keyword) return true;

                const text = (item.title + ' ' + stripHtml(item.description)).toLowerCase();
                return text.includes(keyword);
            });
        }

        function renderFeatured(items) {
            const container = document.getElementById('featuredContainer');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="section-empty">No featured update for this filter.</div></div>';
                return;
            }

            container.innerHTML = items.map(function (item) {
                const meta = typeMeta(item.type);
                const dateInfo = item.createdAt ? ('Published ' + relativeTime(item.createdAt)) : 'Published recently';
                const expiry = item.expiryAt ? (' - Expires ' + shortDate(item.expiryAt)) : '';
                const imageUrl = item.imageUrl || '';
                const mediaStyle = imageUrl ? 'style="--featured-image: url(' + imageUrl + ');"' : '';
                const authorHtml = item.author
                    ? '<span class="featured-author"><i class="fa-solid fa-circle-user"></i>' + escapeHtml(item.author) + '</span>'
                    : '';
                const actionHtml = item.ctaUrl
                    ? '<a class="featured-cta" href="' + item.ctaUrl + '" target="_blank" rel="noopener">' + escapeHtml(meta.actionText) + '<i class="fa-solid fa-arrow-right"></i></a>'
                    : '';
                const pinnedBadge = item.isPinned ? '<span class="featured-chip pinned">Featured</span>' : '';
                const readMore = item.hasDetail ? '<span class="featured-readmore">Read More <i class="fa-solid fa-arrow-right"></i></span>' : '';
                return [
                    '<div class="col-xl-6 col-lg-6 col-12">',
                    '<article class="featured-card" data-news-id="' + escapeHtml(item.id || '') + '">',
                    '<div class="featured-media" ' + mediaStyle + '>',
                    '<div class="featured-body">',
                    '<div class="featured-topline">',
                    pinnedBadge,
                    '<span class="featured-type ' + meta.className + '">' + escapeHtml(meta.label) + '</span>',
                    readMore,
                    '</div>',
                    '<h3 class="featured-title">' + escapeHtml(item.title) + '</h3>',
                    '<div class="featured-desc">' + renderDescription(item.description) + '</div>',
                    '<div class="featured-meta">' + authorHtml + '<span>' + escapeHtml(dateInfo + expiry) + '</span></div>',
                    '<div class="featured-actions">' + actionHtml + '</div>',
                    '</div>',
                    '</div>',
                    '</article>',
                    '</div>'
                ].join('');
            }).join('');
        }

        function renderRecent(items) {
            const container = document.getElementById('recentContainer');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<div class="section-empty border-0 bg-transparent">No additional news found.</div>';
                return;
            }

            container.innerHTML = items.map(function (item) {
                const meta = typeMeta(item.type);
                const when = item.createdAt ? relativeTime(item.createdAt) : 'Recently';
                const dateText = item.createdAt ? shortDate(item.createdAt) : 'Unknown date';
                const read = estimateReadTime(item.description);
                const author = item.author || 'ThinkTala Desk';
                const authorInitial = escapeHtml((author.charAt(0) || 'T').toUpperCase());
                const media = item.imageUrl
                    ? '<div class="recent-media"><img src="' + item.imageUrl + '" alt="' + escapeHtml(item.title) + '"></div>'
                    : '<div class="recent-media recent-media-fallback" style="color:' + meta.iconColor + ';"><i class="' + meta.icon + '"></i></div>';
                const actionHtml = item.ctaUrl
                    ? '<a class="recent-link" href="' + item.ctaUrl + '" target="_blank" rel="noopener">Read Story <i class="fa-solid fa-arrow-right"></i></a>'
                    : '';
                const readMore = item.hasDetail ? '<span class="recent-readmore">Read More <i class="fa-solid fa-arrow-right"></i></span>' : '';

                return [
                    '<article class="recent-item" data-news-id="' + escapeHtml(item.id || '') + '">',
                    '<div class="recent-content">',
                    '<div class="recent-author-row">',
                    '<span class="recent-author-avatar">' + authorInitial + '</span>',
                    '<span class="recent-author-name">' + escapeHtml(author) + '</span>',
                    '<span class="recent-item-type ' + meta.className + '">' + escapeHtml(meta.label) + '</span>',
                    '</div>',
                    '<h3 class="recent-item-title">' + escapeHtml(item.title) + '</h3>',
                    '<div class="recent-item-desc">' + renderDescription(item.description) + '</div>',
                    '<div class="recent-footer">',
                    '<div class="recent-meta">',
                    '<span><i class="fa-regular fa-calendar"></i>' + escapeHtml(dateText) + '</span>',
                    '<span><i class="fa-regular fa-clock"></i>' + escapeHtml(read) + '</span>',
                    '<span><i class="fa-regular fa-eye"></i>' + escapeHtml(when) + '</span>',
                    '</div>',
                    readMore,
                    actionHtml,
                    '</div>',
                    '</div>',
                    media,
                    '</article>'
                ].join('');
            }).join('');
        }

        function renderDiscover() {
            const filtered = getFilteredItems();
            const showFeatured = DISCOVER_STATE.activeFilter === 'all';
            const featuredTitle = document.querySelector('.discover-section-title');
            const featuredContainer = document.getElementById('featuredContainer');
            if (featuredTitle) {
                featuredTitle.style.display = showFeatured ? '' : 'none';
            }
            if (featuredContainer) {
                featuredContainer.style.display = showFeatured ? '' : 'none';
            }

            let recent = filtered;

            if (showFeatured) {
                const pinned = filtered.filter(function (item) { return item.isPinned; });
                const featured = pinned.slice(0, 2);
                const featuredIds = new Set(featured.map(function (item) { return item.id; }));
                recent = filtered.filter(function (item) {
                    return !featuredIds.has(item.id) && !item.isPinned;
                });
                renderFeatured(featured);
            } else if (featuredContainer) {
                featuredContainer.innerHTML = '';
            }

            renderRecent(recent);
            bindCardClicks();
        }

        function setTabFilter(filter) {
            DISCOVER_STATE.activeFilter = filter;
            document.querySelectorAll('.discover-tab').forEach(function (btn) {
                const isActive = btn.getAttribute('data-filter') === filter;
                btn.classList.toggle('active', isActive);
            });
            renderDiscover();
        }

        function bindDiscoverControls() {
            document.querySelectorAll('.discover-tab').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const filter = btn.getAttribute('data-filter') || 'all';
                    setTabFilter(filter);
                });
            });

            const searchInput = document.getElementById('discoverSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    DISCOVER_STATE.keyword = searchInput.value || '';
                    renderDiscover();
                });
            }

			const backBtn = document.getElementById('detailBackBtn');
			if (backBtn) {
				backBtn.addEventListener('click', function () {
					showListView(true);
				});
			}
        }

        async function initDiscoverPage() {
            bindDiscoverControls();

            let source = [];
            try {
                source = await fetchNotifications();
            } catch (err) {
                source = DISCOVER_FALLBACK;
            }

            const normalized = source.map(parseNotification).filter(Boolean).sort(function (a, b) {
                const aTime = a.createdAt ? a.createdAt.getTime() : 0;
                const bTime = b.createdAt ? b.createdAt.getTime() : 0;
                return bTime - aTime;
            });

            DISCOVER_STATE.allItems = normalized;
            applyCountToSidebar(normalized.length);
            renderDiscover();

            const detailId = getDetailIdFromLocation();
            if (detailId) {
                openNotificationById(detailId, false);
            }
        }

        document.addEventListener('DOMContentLoaded', initDiscoverPage);

        window.addEventListener('popstate', function () {
            const detailId = getDetailIdFromLocation();
            if (detailId) {
                openNotificationById(detailId, false);
                return;
            }
            showListView(false);
        });
    </script>
</body>
</html>
