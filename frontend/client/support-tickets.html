<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Kendala | ThinkTala Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        .tickets-card { border: 1px solid var(--border-color); }
        .filter-card { border: 1px solid var(--border-color); }
        .filter-label {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-muted);
            margin-bottom: .35rem;
            display: block;
        }
        .filter-control, .filter-control:focus {
            background: var(--bg-panel);
            border-color: var(--border-color);
            color: var(--text-main) !important;
            box-shadow: none;
        }
        .filter-control:focus { border-color: var(--accent-cyan); }
        .filter-control::placeholder { color: var(--text-muted); }
        .table-shell { overflow-x: auto; }
        .tickets-table { --bs-table-bg: transparent; color: var(--text-main); margin-bottom: 0; }
        .tickets-table td, .tickets-table th {
            border-color: var(--border-color) !important;
            color: var(--text-main) !important;
            background: transparent !important;
            vertical-align: middle;
        }
        .tickets-table thead th {
            text-transform: uppercase;
            font-size: .7rem;
            letter-spacing: .08em;
            color: var(--text-muted);
            font-weight: 600;
            padding-top: .95rem;
            padding-bottom: .95rem;
        }
        .tickets-table tbody tr:hover td { background: rgba(255,255,255,.03) !important; }
        .tickets-table a,
        .tickets-table a:visited {
            color: var(--text-main);
        }
        .tickets-table .btn-outline-secondary {
            border-color: var(--border-color);
        }
        .ticket-title {
            max-width: 560px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .status-badge {
            font-size: .68rem;
            font-weight: 700;
            padding: .28rem .52rem;
            border-radius: 999px;
            letter-spacing: .02em;
        }
        .status-onprocess { background: #ffc107; color: #111; }
        .status-done { background: #22c55e; color: #0b1222; }
        .table-foot {
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: .82rem;
            padding-top: .75rem;
            margin-top: .45rem;
        }
        .skeleton {
            height: 13px;
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.14) 37%, rgba(255,255,255,.06) 63%);
            background-size: 400% 100%;
            animation: sk 1.15s ease infinite;
        }
        @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    </style>
</head>
<body>
<div id="client-sidebar-placeholder"></div>
<div id="client-navbar-placeholder"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h4 class="fw-bold mb-0" style="color: var(--text-heading)">Riwayat Laporan Kendala</h4>
            <small class="text-muted">Lacak progres penanganan laporan Anda.</small>
        </div>
        <a href="/client/support-create" class="btn btn-sm btn-primary px-3">
            <i class="fa-solid fa-plus me-1"></i> Buat Tiket Baru
        </a>
    </div>

    <div class="ai-card shadow-lg mb-3 filter-card">
        <div class="row g-2 align-items-center">
            <div class="col-md-3">
                <label class="filter-label">Filter Status</label>
                <select id="statusFilter" class="form-select form-select-sm filter-control">
                    <option value="">Semua Status</option>
                    <option value="on-process">On Process</option>
                    <option value="done">Done</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="filter-label">Urutan Waktu</label>
                <select id="timeSort" class="form-select form-select-sm filter-control">
                    <option value="desc">Newest</option>
                    <option value="asc">Oldest</option>
                </select>
            </div>
            <div class="col-md-7">
                <label class="filter-label">Cari Judul</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text filter-control" style="color: var(--text-muted);"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input id="searchInput" type="text" class="form-control filter-control" placeholder="Cari judul laporan...">
                    <button id="resetSearchBtn" class="btn btn-outline-secondary filter-control" type="button" title="Reset">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="ai-card shadow-lg tickets-card">
        <div class="table-shell">
            <table class="table tickets-table mb-0">
                <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Judul</th>
                    <th>Status</th>
                    <th class="text-end">Aksi</th>
                </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="emptyState" class="text-center py-5 text-muted d-none">
            <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>
            <div id="emptyText">Tidak Ditemukan</div>
        </div>
        <div class="d-flex justify-content-between align-items-center table-foot">
            <span id="tableInfo">Menampilkan 0 data</span>
            <div id="paginationControls" class="d-flex gap-1"></div>
        </div>
    </div>
</div>

<script src="/assets/js/client-layout.js"></script>
<script>
    const state = { status: "", sort: "desc", search: "", page: 1, per_page: 6 };
    let timer = null;

    const tableBody = document.getElementById("tableBody");
    const emptyState = document.getElementById("emptyState");
    const emptyText = document.getElementById("emptyText");
    const statusFilter = document.getElementById("statusFilter");
    const timeSort = document.getElementById("timeSort");
    const searchInput = document.getElementById("searchInput");
    const resetSearchBtn = document.getElementById("resetSearchBtn");
    const tableInfo = document.getElementById("tableInfo");
    const paginationControls = document.getElementById("paginationControls");

    function parseTicketDate(dateStr) {
        const raw = String(dateStr || "").trim();
        const parsed = new Date(raw);
        if (Number.isNaN(parsed.getTime())) return parsed;

        if (raw.endsWith("Z")) {
            const localCandidate = new Date(raw.slice(0, -1));
            if (!Number.isNaN(localCandidate.getTime())) {
                const nowMs = Date.now();
                const utcLooksTooFuture = (parsed.getTime() - nowMs) > (60 * 60 * 1000);
                const localLooksReasonable = localCandidate.getTime() <= (nowMs + (2 * 60 * 1000));
                if (utcLooksTooFuture && localLooksReasonable) return localCandidate;
            }
        }
        return parsed;
    }

    function formatTime(dateStr) {
        const date = parseTicketDate(dateStr);
        if (Number.isNaN(date.getTime())) return { primary: "-", secondary: "-" };

        const now = new Date();
        const diffMs = Math.max(0, now.getTime() - date.getTime());
        const oneMinuteMs = 1000 * 60;
        const oneHourMs = 1000 * 60 * 60;
        const oneDayMs = 1000 * 60 * 60 * 24;

        let relative = "1 minute";
        if (diffMs < oneHourMs) {
            const diffMinutes = Math.max(1, Math.ceil(diffMs / oneMinuteMs));
            relative = `${diffMinutes} ${diffMinutes === 1 ? "minute" : "minutes"}`;
        } else if (diffMs < oneDayMs) {
            const diffHours = Math.ceil(diffMs / oneHourMs);
            relative = `${diffHours} ${diffHours === 1 ? "hour" : "hours"}`;
        } else {
            const diffDays = Math.ceil(diffMs / oneDayMs);
            relative = `${diffDays} ${diffDays === 1 ? "day" : "days"}`;
        }

        const dd = String(date.getDate()).padStart(2, "0");
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const yyyy = date.getFullYear();
        const hh = String(date.getHours()).padStart(2, "0");
        const min = String(date.getMinutes()).padStart(2, "0");
        return { primary: relative, secondary: `${dd}-${mm}-${yyyy} ${hh}:${min}` };
    }

    function renderLoading() {
        emptyState.classList.add("d-none");
        paginationControls.innerHTML = "";
        const rows = Array.from({ length: 5 }, () => `
            <tr>
                <td class="py-3"><div class="skeleton" style="width:80px"></div></td>
                <td class="py-3"><div class="skeleton" style="width:260px"></div></td>
                <td class="py-3"><div class="skeleton" style="width:90px"></div></td>
                <td class="py-3 text-end"><div class="skeleton" style="width:40px;margin-left:auto"></div></td>
            </tr>
        `).join("");
        tableBody.innerHTML = rows;
    }

    function renderPagination(meta) {
        const totalPages = Number(meta.total_pages) || 0;
        if (totalPages <= 1) {
            paginationControls.innerHTML = "";
            return;
        }

        let html = '';
        html += `<button class="btn btn-sm btn-outline-secondary" ${state.page <= 1 ? 'disabled' : ''} onclick="changePage(${state.page - 1})">Prev</button>`;

        const maxButtons = Math.min(totalPages, 5);
        for (let i = 1; i <= maxButtons; i++) {
            const activeStyle = i === state.page ? 'background:var(--text-heading);color:#000;border-color:var(--text-heading);' : '';
            html += `<button class="btn btn-sm btn-outline-secondary" style="min-width:34px;${activeStyle}" onclick="changePage(${i})">${i}</button>`;
        }
        if (totalPages > 5) {
            html += `<span class="btn btn-sm btn-outline-secondary disabled">...</span>`;
            html += `<button class="btn btn-sm btn-outline-secondary" onclick="changePage(${totalPages})">${totalPages}</button>`;
        }

        html += `<button class="btn btn-sm btn-outline-secondary" ${state.page >= totalPages ? 'disabled' : ''} onclick="changePage(${state.page + 1})">Next</button>`;
        paginationControls.innerHTML = html;
    }

    function renderRows(items, meta) {
        if (!Array.isArray(items) || items.length === 0) {
            tableBody.innerHTML = "";
            emptyText.textContent = state.search ? "Tidak Ditemukan" : "Belum ada riwayat laporan";
            emptyState.classList.remove("d-none");
            tableInfo.textContent = "Menampilkan 0 data";
            renderPagination(meta || {});
            return;
        }

        emptyState.classList.add("d-none");
        const total = Number((meta && meta.total) || items.length);
        tableInfo.textContent = `Menampilkan ${items.length} dari ${total} data`;
        tableBody.innerHTML = items.map((it) => {
            const st = String(it.status || "").toUpperCase();
            const stClass = st === "DONE" ? "status-done" : "status-onprocess";
            return `
                <tr>
                    <td class="py-3">
                        <div>${formatTime(it.created_at).primary}</div>
                        <small class="text-muted">${formatTime(it.created_at).secondary}</small>
                    </td>
                    <td class="py-3"><div class="ticket-title">${it.title || "-"}</div></td>
                    <td class="py-3"><span class="status-badge ${stClass}">${st || "-"}</span></td>
                    <td class="py-3 text-end">
                        <a class="btn btn-sm btn-outline-secondary" href="/client/support-ticket-detail?id=${encodeURIComponent(it.id || "")}" title="Lihat detail">
                            <i class="fa-solid fa-eye"></i>
                        </a>
                    </td>
                </tr>
            `;
        }).join("");
        renderPagination(meta || {});
    }

    function changePage(page) {
        if (page < 1) return;
        state.page = page;
        loadData();
    }

    async function loadData() {
        renderLoading();
        const qs = new URLSearchParams();
        if (state.status) qs.set("status", state.status);
        if (state.search) qs.set("search", state.search);
        qs.set("sort", state.sort);
        qs.set("page", String(state.page));
        qs.set("per_page", String(state.per_page));

        const res = await fetch(`/api/support/tickets/me?${qs.toString()}`, {
            credentials: "include",
            headers: { Accept: "application/json" }
        });

        if (res.status === 401) {
            window.location.href = "/account/login";
            return;
        }
        if (res.status === 403) {
            tableBody.innerHTML = "";
            emptyText.textContent = "Akses ditolak";
            emptyState.classList.remove("d-none");
            paginationControls.innerHTML = "";
            return;
        }
        const json = await res.json().catch(() => ({ data: [], pagination: { page: 1, per_page: 6, total: 0, total_pages: 0 } }));
        const meta = json && json.pagination ? json.pagination : { page: state.page, per_page: state.per_page, total: 0, total_pages: 0 };
        state.page = Number(meta.page) || state.page;
        renderRows(Array.isArray(json.data) ? json.data : [], meta);
    }

    statusFilter.addEventListener("change", () => {
        state.status = statusFilter.value;
        state.page = 1;
        loadData();
    });

    timeSort.addEventListener("change", () => {
        state.sort = timeSort.value === "asc" ? "asc" : "desc";
        state.page = 1;
        loadData();
    });

    searchInput.addEventListener("input", (e) => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
            state.search = (e.target.value || "").trim();
            state.page = 1;
            loadData();
        }, 500);
    });

    resetSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.search = "";
        state.page = 1;
        loadData();
    });

    window.changePage = changePage;
    loadData();
</script>
</body>
</html>
